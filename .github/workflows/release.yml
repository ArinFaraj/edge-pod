name: build-release
on:
  push:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'docs/**', '.gitignore', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build
        id: pkg
        run: |
          flutter pub get
          cd edge_pod_server
          dart build cli --target bin/main.dart --target-os=linux --target-arch=arm64 --output build
          cp -R config build/bundle/config
          cp -R migrations build/bundle/migrations
          cd ..
          {
            echo '#!/bin/sh'
            echo 'set -e'
            echo 'HASH=$(sha256sum "$0" 2>/dev/null | cut -c1-16 || echo "default")'
            echo 'DIR="${TMPDIR:-/tmp}/edge-pod-$HASH"'
            echo 'if [ ! -f "$DIR/.unpacked" ]; then'
            echo '  mkdir -p "$DIR"'
            echo '  sed '\''1,/^#__ARCHIVE__#/d'\'' "$0" | tar -xz -C "$DIR"'
            echo '  touch "$DIR/.unpacked"'
            echo 'fi'
            echo 'cd "$DIR"'
            echo 'exec "$DIR/bin/main" "$@"'
            echo '#__ARCHIVE__#'
          } > edge-pod
          tar -czf bundle.tar.gz -C edge_pod_server/build/bundle .
          cat bundle.tar.gz >> edge-pod
          tar -czf dist.tgz -C edge_pod_server/build/bundle .
          rm -f bundle.tar.gz
          chmod +x edge-pod
          sha256sum edge-pod > edge-pod.sha256
          sha256sum dist.tgz > dist.tgz.sha256
          echo "${GITHUB_SHA::8}" > VERSION
          [ "$GITHUB_REF_NAME" = main ] && TAG="sha-${GITHUB_SHA::8}" || TAG="$GITHUB_REF_NAME-${GITHUB_SHA::8}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "${{ env.TAG }} (${{ github.sha }})"
          prerelease: ${{ github.ref_name != 'main' }}
          files: |
            edge-pod
            edge-pod.sha256
            dist.tgz
            dist.tgz.sha256
            VERSION

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        continue-on-error: true
        with:
          app-id: ${{ secrets.EDGE_STATE_APP_ID }}
          private-key: ${{ secrets.EDGE_STATE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: edge-state
      - uses: actions/checkout@v4
        if: steps.token.outcome == 'success'
        with:
          repository: ${{ github.repository_owner }}/edge-state
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - run: ci/bump "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${{ needs.build.outputs.tag }}"
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
